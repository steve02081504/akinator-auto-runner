<div class="aar-weight aar-answer-${index}" data-index="${index}">
	<span class="aar-dot"></span>
	<span class="aar-weight-label">${label}</span>
	<input class="aar-weight-input" type="number" min="0" step="1" inputmode="decimal" data-field="weight" data-key="${key}" data-index="${index}" value="${value}">
	<i class="aar-weight-bar"><i style="width:${percent}%"></i></i>
	<span class="aar-weight-pct">${percent}%</span>
</div>
