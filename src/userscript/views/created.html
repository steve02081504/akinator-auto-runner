<div class="aar-box aar-created">
	<div class="aar-created-head">
		<span class="aar-created-badge">${badge}</span>
		${photo}
		<span class="aar-card-main">
			<span class="aar-card-title">${title}</span>
			<span class="aar-muted">${hint}</span>
		</span>
		<button class="aar-icon" data-action="dismiss-created" data-i18n-title="run.dismissCreated">${closeIcon}</button>
	</div>
	<div class="aar-row aar-inline">
		<button class="aar-primary" data-action="edit-character" data-id="${id}" data-i18n="characters.edit"></button>
		<button data-action="run-character" data-id="${id}" data-i18n="run.replay"></button>
		<button data-action="view-character" data-i18n="nav.characters"></button>
	</div>
</div>
