name: Deploy Pages

on:
  push:
    paths:
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
      - 'src/shared/**'
      - 'src/userscript/**'
      - 'data/**'
      - 'scripts/**'
      - 'package.json'
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # 依赖统一跟随 latest（仓库不跟踪锁文件），因此用 install 而非 ci。
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - run: node scripts/assemble-pages.mjs
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .github/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
