<div class="aar-box aar-highlight aar-intervene">
	<div class="aar-row aar-inline"><span class="aar-ask-icon">${icon}</span><span>${title}</span></div>
	<div class="aar-row aar-inline aar-intervene-option">
		<button class="aar-primary" data-action="intervene" data-id="correct" data-i18n="run.interveneCorrect"></button>
		<span class="aar-muted" data-i18n="run.interveneCorrectHint"></span>
	</div>
	<div class="aar-row aar-inline aar-intervene-option">
		<button data-action="intervene" data-id="append" data-i18n="run.interveneAppend"></button>
		<span class="aar-muted" data-i18n="run.interveneAppendHint"></span>
	</div>
</div>
