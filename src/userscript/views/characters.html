<div class="aar-search">
	<span class="aar-search-icon">${searchIcon}</span>
	<input class="aar-grow" type="search" placeholder="${searchPlaceholder}" value="${query}" data-action="search" data-scope="characters">
</div>
<div class="aar-row aar-inline">
	<button class="aar-primary" data-action="new-character">${addIcon}<span data-i18n="characters.add"></span></button>
	<span class="aar-grow"></span>
	<span class="aar-muted">${countLabel}</span>
</div>
<div class="aar-list">${cards}</div>
